[workspace]
resolver = "3"
members = [
    "crates/estante-types",
    "crates/estante",
]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/pleme-io/estante"
repository = "https://github.com/pleme-io/estante"
authors = ["pleme-io"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# Doc comments routinely mention SCREAMING-CASE acronyms (BLAKE3,
# JSON, CLI, CI, XDG, …) and product names (NixOS, MacOS). Putting
# every one of these in backticks adds noise without correctness
# value — the lint is about API identifiers that resemble English
# words, not about general acronyms.
doc_markdown = "allow"

[workspace.dependencies]
# Workspace crates
estante-types = { path = "crates/estante-types" }

# Typed-dispatcher catalog integration
# (theory/UNIFIED-COMPUTING-MODEL.md §VI).
gen-platform = { git = "https://github.com/pleme-io/gen" }
gen-types = { git = "https://github.com/pleme-io/gen" }

# pleme-io sibling crates — the typed forms (PkgSpec, LoadSpec,
# LockedPkgSpec) live in frost-lisp::pkg; estante is a consumer, not
# a duplicate source of truth (Pillar 12: solve once).
#
# Git dep keeps Dependabot happy (it can't follow `../` path deps);
# `branch = "main"` so consumers always get the tip. Local
# development: add a [patch.'https://github.com/pleme-io/frost']
# section in `.cargo/config.toml` pointing at the local checkout.
frost-lisp = { git = "https://github.com/pleme-io/frost", branch = "main" }

# tatara-lisp from crates.io, the same release frost resolves, so a single
# copy lands in the dep graph (no duplicate DeriveTataraDomain impls). The
# retired pleme-io/tatara git source published the same crate names, so
# mixing the two put two `TataraDomain` traits in one graph and
# `PkgSpec: TataraDomain` stopped being satisfied. frost moved to the
# registry in 307d0e3; estante tracks frost by branch, so both now agree.
tatara-lisp = "0.3.3"

# cofre — the fleet credential primitive. `Secret` implements no
# Display / AsRef<str> / AsRef<OsStr>, so a PAT held in one cannot be
# interpolated into a format string or handed to Command::arg: the
# leak is a compile error rather than a review finding. Dependency-free.
cofre-secret = { git = "https://github.com/pleme-io/cofre" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Hashing — BLAKE3 is the tameshi-chain attestation primitive.
blake3 = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async / IO
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util"] }

# GitHub SDK — the only registry. octocrab is the canonical Rust
# client; search + tarball download + rate-limit budgeting all
# flow through it.
octocrab = "0.43"

# `octocrab::body` is private — read response bodies via the
# http-body-util `BodyExt::collect()` extension trait. octocrab
# already pulls this transitively; we just need it as a direct
# dep to import the trait in our code.
http-body-util = "0.1"

# Tarball unpack — public-repo archive downloads land as .tar.gz;
# tar + flate2 unpack to the local cache dir without invoking a
# shell or external `tar` binary (NO SHELL directive).
tar = "0.4"
flate2 = "1"

# Atomic writes for the lockfile (write-temp + rename) so a
# crash during emit doesn't leave a half-written shellpkg.lock.lisp.
tempfile = "3"

# XDG path discovery — cache + config dir resolution per spec.
dirs = "5"

# Tracing — structured logs through the standard pleme-io macros
# (tracing::info!/error! are the typed emission surface; never
# println!/eprintln!).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
pretty_assertions = "1"
# Property-based testing — generates thousands of random inputs to
# verify invariants like "parse(render(x)) == x for any x".
# Determinism + correctness guard beyond what example tests catch.
proptest = "1"
# Snapshot tests — wire-format stability for typed renderers.
# Catches accidental format drift in Manifest/Lockfile/Nix output.
insta = { version = "1", features = ["yaml"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
