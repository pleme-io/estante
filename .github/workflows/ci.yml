name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: cargo test + clippy + fmt
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace -- --test-threads=1

  dogfood:
    name: dogfood — lock/attest/verify/doctor against examples/
    runs-on: macos-15
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: cargo build --release
        run: cargo build --release -p estante

      - name: estante lock --emit-receipt (against examples/)
        working-directory: examples/frostmourne-style/consumer
        run: ../../../target/release/estante lock --emit-receipt

      - name: estante attest --check (matches the receipt we just wrote)
        working-directory: examples/frostmourne-style/consumer
        run: ../../../target/release/estante attest --check --json

      - name: estante lock --check (lockfile reflects manifest)
        working-directory: examples/frostmourne-style/consumer
        run: ../../../target/release/estante lock --check

      - name: estante verify --strict (BLAKE3 tree matches lockfile)
        working-directory: examples/frostmourne-style/consumer
        run: ../../../target/release/estante verify --strict --json

      - name: estante doctor (full health audit)
        working-directory: examples/frostmourne-style/consumer
        run: ../../../target/release/estante doctor --json
