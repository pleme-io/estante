name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

defaults:
  run:
    # estante's workspace.dependencies points at `../frost/crates/frost-lisp`
    # via a local path dep, so the CI runner needs `estante/` and
    # `frost/` as sibling directories. All step commands run from
    # estante/ so the workspace Cargo.toml resolves frost-lisp correctly.
    working-directory: estante

jobs:
  test:
    name: cargo test + clippy + fmt (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The linux leg routes on visibility; macOS stays metered because
        # Camelot is linux-only and this suite genuinely exercises the darwin
        # path. A matrix-supplied runner is invisible to a sweep for
        # `runs-on: ubuntu-*`, which is why this kept billing after the fleet
        # was routed — recorded so the next sweep looks for both shapes.
        os:
          # runner-policy: allow darwin coverage — Camelot is linux-only and this
          # suite genuinely exercises the macOS path.
          - macos-15
          - ${{ github.event.repository.private && 'camelot-builder-pleme-eks' || 'ubuntu-latest' }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout estante
        uses: actions/checkout@v4
        with:
          path: estante

      - name: Checkout frost (sibling for local path dep)
        uses: actions/checkout@v4
        with:
          repository: pleme-io/frost
          path: frost

      # `cargo fmt --all` walks local path-based deps (including the
      # sibling frost checkout), so scope explicitly to our two
      # crates. `cargo clippy --workspace` is fine — it respects the
      # workspace boundary defined in our Cargo.toml. clippy is kept
      # informational (no -D warnings) per the fleet pattern; pedantic
      # warnings are advisory, not gates, and gating CI on them
      # produces churn without correctness value.
      - name: cargo fmt --check
        run: cargo fmt -p estante -p estante-types -- --check

      - name: cargo clippy (informational)
        run: cargo clippy --workspace --all-targets
        continue-on-error: true

      - name: cargo test --workspace
        run: cargo test --workspace -- --test-threads=1

  dogfood:
    name: dogfood — lock/attest/verify/doctor against examples/ (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The linux leg routes on visibility; macOS stays metered because
        # Camelot is linux-only and this suite genuinely exercises the darwin
        # path. A matrix-supplied runner is invisible to a sweep for
        # `runs-on: ubuntu-*`, which is why this kept billing after the fleet
        # was routed — recorded so the next sweep looks for both shapes.
        os:
          # runner-policy: allow darwin coverage — Camelot is linux-only and this
          # suite genuinely exercises the macOS path.
          - macos-15
          - ${{ github.event.repository.private && 'camelot-builder-pleme-eks' || 'ubuntu-latest' }}
    runs-on: ${{ matrix.os }}
    needs: test
    steps:
      - name: Checkout estante
        uses: actions/checkout@v4
        with:
          path: estante

      - name: Checkout frost (sibling for local path dep)
        uses: actions/checkout@v4
        with:
          repository: pleme-io/frost
          path: frost

      - name: cargo build --release
        run: cargo build --release -p estante

      - name: estante lock --emit-receipt (against examples/)
        working-directory: estante/examples/frostmourne-style/consumer
        run: ../../../target/release/estante lock --emit-receipt

      - name: estante attest --check (matches the receipt we just wrote)
        working-directory: estante/examples/frostmourne-style/consumer
        run: ../../../target/release/estante attest --check --json

      - name: estante lock --check (lockfile reflects manifest)
        working-directory: estante/examples/frostmourne-style/consumer
        run: ../../../target/release/estante lock --check

      - name: estante verify --strict (BLAKE3 tree matches lockfile)
        working-directory: estante/examples/frostmourne-style/consumer
        run: ../../../target/release/estante verify --strict --json

      - name: estante doctor (full health audit)
        working-directory: estante/examples/frostmourne-style/consumer
        run: ../../../target/release/estante doctor --json
